<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICT Lesson 1</title><link rel="manifest" href="/manifest.webmanifest"><style>body{margin:0;background:#071426;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.c{text-align:center;padding:24px}.s{opacity:.7}</style></head><body><div class="c"><h2>ICT පාඩම 1</h2><p class="s">සම්පූර්ණ පාඩම පූරණය වෙමින්…</p></div><script>(async()=>{try{const r=await fetch('/app.b64');const b=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const h=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="c"><h2>ICT පාඩම 1</h2><p>App එක පූරණය කිරීමට නොහැකි වුණා. නැවත refresh කරන්න.</p></div>'}})();</script></body></html>
