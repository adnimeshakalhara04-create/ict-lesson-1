<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>ICT පාඩම 1 — 541</title><link rel="manifest" href="./manifest.webmanifest"><style>body{margin:0;background:#071426;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.c{text-align:center;padding:24px}.s{opacity:.72}</style></head><body><div class="c"><h2>ICT පාඩම 1</h2><p id="m" class="s">සම්පූර්ණ ප්‍රශ්න 541 පූරණය වෙමින්…</p></div><script>(async()=>{try{const r=await fetch('./ICT_Lesson_1_Full_541_Installable_App.zip',{cache:'no-store'});if(!r.ok)throw Error('zip '+r.status);const a=new Uint8Array(await r.arrayBuffer()),v=new DataView(a.buffer);let p=0,h='';while(p+30<a.length&&v.getUint32(p,true)===0x04034b50){const m=v.getUint16(p+8,true),cs=v.getUint32(p+18,true),nl=v.getUint16(p+26,true),el=v.getUint16(p+28,true),n=new TextDecoder().decode(a.slice(p+30,p+30+nl)),s=p+30+nl+el,c=a.slice(s,s+cs);if(n==='index.html'){if(m===0)h=new TextDecoder().decode(c);else if(m===8)h=await new Response(new Blob([c]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();break}p=s+cs}if(!h)throw Error('index not found');document.open();document.write(h);document.close()}catch(e){document.getElementById('m').textContent='App එක පූරණය කිරීමට නොහැකි වුණා. Refresh කරන්න.';console.error(e)}})();</script></body></html>
